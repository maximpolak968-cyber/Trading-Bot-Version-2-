services:
  - type: web
    name: frequi-scalpbot-terminal
    runtime: docker
    region: frankfurt
    plan: starter
    healthCheckPath: /api/v1/ping
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: SQLITE_DB_PATH
        value: /data/trades.sqlite
      - key: OWNER_LOGIN
        value: admin
      - key: OWNER_PASSWORD
        sync: false
      - key: DRY_RUN
        value: "false"
    disk:
      name: trading-data
      mountPath: /data
      sizeGB: 1

